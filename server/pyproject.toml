[project]
name = "lessons-server"
version = "0.1.0"
description = "API + Telegram admin bot for the Lessons school diary app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    # 3.31 is the floor, not a preference: it is the first release to carry
    # Bot API 9.3's ``InlineKeyboardButton.style``, and on anything older every
    # coloured keyboard in ``app/bot/button_style.py`` raises at construction
    # rather than quietly drawing grey. requirements.txt already said 3.31.
    "aiogram>=3.31.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.20",
    "asyncpg>=0.31.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.15.0",
    # The Petersburg diary provider talks to an upstream over HTTP. It was
    # already here as a test dependency (httpx drives the ASGI client); this
    # promotes it, because now a request path uses it.
    "httpx>=0.28.1",
    # Fernet, for the one credential that is stored recoverably rather than
    # hashed — the diary's upstream session token (see app/crypto.py). It was
    # already present as somebody's transitive dependency; a security floor is
    # not something to inherit by accident.
    "cryptography>=50.0.1",
    # Schema changes. Not in requirements.txt: migrations are run from a
    # workstation against the database, never from inside a request, and the
    # function bundle is smaller without it.
    "alembic>=1.13",
]

# Spelled out because the repository is a flat layout and now has more than one
# top-level directory: setuptools' auto-discovery refuses to guess between
# `app` and `alembic` and fails the install outright. Migrations are run from a
# checkout with `alembic upgrade head`, never imported, so only the application
# and its one-shot scripts are packaged.
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends()/Query() in a default is how FastAPI declares dependencies.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
