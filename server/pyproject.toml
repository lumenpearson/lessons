[project]
name = "lessons-server"
version = "0.1.0"
description = "API + Telegram admin bot for the Lessons school diary app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.30",
    # 3.31 is the floor, not a preference: it is the first release to carry
    # Bot API 9.3's ``InlineKeyboardButton.style``, and on anything older every
    # coloured keyboard in ``app/bot/button_style.py`` raises at construction
    # rather than quietly drawing grey. requirements.txt already said 3.31.
    "aiogram>=3.31.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "aiosqlite>=0.20",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # The container both shells draw a session from (app/di.py). Wanted for
    # aiogram as much as for FastAPI: `Depends` cannot serve a bot handler, and
    # this project is two shells over one implementation, so «a session for one
    # unit of work» had three definitions and now has one.
    #
    # No ceiling, unlike httpx: nothing here depends on behaviour its authors
    # have announced they are removing. The floor is where `STRICT_VALIDATION`
    # and the aiogram integration both exist.
    "dishka>=1.10.1",
    # The Petersburg diary provider talks to an upstream over HTTP. It was
    # already here as a test dependency (httpx drives the ASGI client); this
    # promotes it, because now a request path uses it.
    #
    # The ceiling is not caution, it is a named dependency on something httpx
    # has announced it is removing. Every diary call is
    # `client.request(..., cookies=...)` — one family's session, passed per
    # request through a client that deliberately keeps no cookie jar of its
    # own (`_NoCookieJar` in providers/petersburg/client.py, so that two
    # families' sessions can never meet). 0.28 warns that per-request cookies
    # are "being deprecated" and points at client-level cookies, which is the
    # one migration this code must not take. A release that dropped the
    # parameter would not fail the build: every diary call would simply go out
    # without a session, and every user would be told theirs expired.
    #
    # 0.28.1 is the newest release there is (the 1.0 line is dev previews), so
    # the bound is the next minor, not the next major — the removal may well
    # land there. Before raising it: check that httpx still accepts
    # `cookies=` on a request, run tests/test_diary_api.py, and if it is gone,
    # set the Cookie header on the request instead of moving the jar.
    "httpx>=0.28.1,<0.29",
    # Fernet, for the one credential that is stored recoverably rather than
    # hashed — the diary's upstream session token (see app/crypto.py). It was
    # already present as somebody's transitive dependency; a security floor is
    # not something to inherit by accident.
    "cryptography>=50.0.2",
    # The v2 contract's runtime (docs/specs/2026-10-04-contract-v2-design.md,
    # decision 2). The code generated into app/contract imports protobuf-py's
    # `protobuf` package, and its services import `connectrpc`; each floor is the
    # version of the Buf plugin that generates for it, which buf.gen.yaml pins
    # and tests/test_contract.py holds level. Since stage 3a app.main imports both,
    # inside mount_v2's fail-safe try, so the cold start carries them and a failed
    # import leaves v1 serving.
    # connectrpc brings pyqwest, a Rust HTTP client of about 16 MB it requires
    # even on a server, and pyqwest brings opentelemetry-api.
    "connectrpc>=0.12.1",
    "protobuf-py>=0.6.0",
    # Sentry (docs/specs/2026-10-05-monitoring-design.md, part 3): each error
    # with its place, and a 5 % sample of request timings. Imported only where
    # SENTRY_DSN is set (app/observability.py), so a deployment without it pays
    # nothing on its cold start. No extra: the FastAPI integration is in the
    # package, and the `fastapi` extra would only ask for FastAPI, which is
    # above. The floor is the release that was current when this was written.
    "sentry-sdk>=2.71.0",
    # Schema changes. Not in requirements.txt: migrations are run from a
    # workstation against the database, never from inside a request, and the
    # function bundle is smaller without it.
    "alembic>=1.13",
    # The time-zone database, on Windows only (#170). `zoneinfo` reads the
    # operating system's, and Windows has none: without this the server does
    # not even import there — `ZoneInfo("Europe/Moscow")` in
    # providers/petersburg/client.py raises ZoneInfoNotFoundError on the way
    # in. Linux, the Docker image and Vercel all ship /usr/share/zoneinfo, so
    # the marker keeps it out of every deployment, and requirements.txt does
    # not carry it (tests/test_requirements_mirror.py says why).
    "tzdata>=2026.4; sys_platform == 'win32'",
]

# Spelled out because the repository is a flat layout and now has more than one
# top-level directory: setuptools' auto-discovery refuses to guess between
# `app` and `alembic` and fails the install outright. Migrations are run from a
# checkout with `alembic upgrade head`, never imported, so only the application
# and its one-shot scripts are packaged.
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

# The region catalog is data, not a module, and setuptools packages only modules
# unless told otherwise. An editable install and Vercel both read it straight out
# of the source tree, so nothing here would notice it missing — a wheel would ship
# `app.catalog` without the file it opens, and the directory endpoint would fail on
# its first request. It is generated by `scripts/region_catalog.py`; the overlay it
# is generated from stays out of the package, because nothing at runtime reads it.
[tool.setuptools.package-data]
app = ["catalog/data/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # The suite is the single most expensive thing this repository runs: on a
    # CI runner it was twelve and a half minutes of a twenty-one-minute bill,
    # and GitHub rounds every job up to a whole minute. `-n auto` spreads it
    # over the runner's cores and finishes in a third of the time. It is safe
    # here by construction rather than by luck: `tests/conftest.py` names the
    # SQLite file from a `mkdtemp` evaluated at import, and each xdist worker
    # is its own process importing it again, so no two workers ever share a
    # database.
    "pytest-xdist>=3.6",
    # Same ceiling as the runtime dependency above, and for the same reason:
    # the test suite is where a release that dropped per-request cookies would
    # be noticed, and it cannot notice it from a version the runtime refuses.
    "httpx>=0.28.1,<0.29",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Not a type checker in the usual sense - one question, asked of the whole
# server: does this code reach for an attribute the type does not have?
#
# That question is here because it was answered the expensive way. «🗓 Четверти»
# crashed on every press in production because `_terms_card` printed
# `term.days`, and `days` lived on a flattened copy of a term that nothing ever
# constructed. `AttributeError`, an error dialog, and no way to find out short
# of pressing the button. Removing the property today reproduces it exactly:
#
#     app/bot/handlers/manage.py:2831: error: "Term" has no attribute "days"
#
# Everything else mypy has to say about this codebase is friction rather than
# fault, so it is switched off by name below. The numbers are what a full run
# reported when this was written, and every one of them was read:
#
#   union-attr (347)  `callback.message` is `Message | InaccessibleMessage |
#                     None` in aiogram, and no handler here has ever met an
#                     inaccessible one. Guarding all 347 would be noise.
#   arg-type   (128)  handlers take `SchoolClass | None` / `Role | None` from
#                     the middleware and refuse early; mypy cannot follow the
#                     refusal through `_allowed()`. Also SQLAlchemy's `where()`
#                     against a plain `bool`.
#   call-arg     (4)  aiogram's `CallbackData` builds `__init__` at runtime.
#   assignment   (3)  a `X | None` narrowed by a branch mypy does not track.
#   return-value (1)  the same shape, on the way out.
#   override     (1)  our FSM storage widens a parameter aiogram declares
#                     narrower, deliberately.
#
# If one of those ever hides a real defect, the cost is a bug this check would
# not have caught - the same position the project was in before it existed.
# Turning a code back on is one line here.
[tool.mypy]
files = ["app"]
# The generated contract is not ours to type-check: regeneration rewrites it
# whole. Excluded from the walk here, and silenced below where hand-written code
# imports it (sub-project 3's rpc/ and rest/), so its types still reach that code.
exclude = ["^app/contract/"]
ignore_missing_imports = true
disable_error_code = [
    "union-attr",
    "arg-type",
    "call-arg",
    "assignment",
    "return-value",
    "override",
]

[[tool.mypy.overrides]]
module = ["app.contract.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The generated contract: buf generate rewrites server/app/contract whole, so a
# finding in it has nobody to fix it. Every generated file already says
# `# ruff: noqa`; this keeps it out of every future rule and of `ruff format`.
extend-exclude = ["app/contract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends()/Query() in a default is how FastAPI declares dependencies.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
