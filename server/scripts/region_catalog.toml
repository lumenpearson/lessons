# What the survey of every region's diary does not say, and the region catalog needs.
#
# `scripts/region_catalog.py` reads this beside `docs/diaries/regions.md` and writes
# `app/catalog/data/regions.json`. Everything the survey *does* say — which systems a
# region runs, in what role, on which hosts, how sure the survey is — comes from the
# survey and is never repeated here. Everything the allow-list says — which «Сетевой
# город» origins exist, whether a password gets in, whether an origin has been seen
# to answer — comes from `app/providers/netschool/regions.py` and is never repeated
# here either. This file is only what nothing in the repository derives.
#
# After an edit, from `server/`:
#
#     python -m scripts.region_catalog          # rewrites the JSON
#     python -m scripts.region_catalog --check  # what the test runs
#
# Rules the generator enforces, so that this file cannot drift quietly:
#
# - `name_ru` of every [[region]] is a `## ` heading of regions.md, character for
#   character, and every heading has exactly one [[region]]. The order of the catalog
#   is the survey's (Constitution Art. 65), not this file's.
# - `key` is what the database stores (`classes.diary_region`, `diary_sessions.region`,
#   the sealed credential). The nineteen «Сетевой город» regions MUST keep the
#   allow-list's key byte for byte — renaming one here orphans every class bound to it.
#   The other seventy are slugs in the same style. Never rename a key once shipped.
# - `code` is the two-digit subject code (КЛАДР/ФНС numbering, the one DaData's
#   `region_kladr_id` starts with). 91 Крым and 92 Севастополь are the long-standing
#   ones. The four subjects admitted in 2022 are NOT VERIFIED: Запорожская 90,
#   ДНР 93, ЛНР 94 and Херсонская 95 are what the survey's author believed the ФНС
#   assigned, and nothing here has checked it against a live DaData answer or a
#   primary source. `by_code` then misses, and the name fallback (`dadata_names`) is
#   what places a school there.
# - `iso` is ISO 3166-2:RU, which has no code for the six subjects above; it is left
#   out for them rather than invented.
# - `zone` is the IANA zone of the region's administrative centre. For a «Сетевой
#   город» region it must equal the allow-list's zone. The four 2022 subjects keep
#   Europe/Moscow: tzdata's own names for Запорожье and Херсон are links to Kyiv time.
# - `dadata_names` are the spellings DaData's `region_with_type` and `region` use for
#   the region — «Респ Татарстан», «г Москва», «Ленинградская обл». They are compared
#   after `app.catalog.normalise_name` (case, ё, punctuation, spaces) and must place
#   exactly one region each. None of them has been checked against a live answer.
# - `aliases` are what people type instead of the name: official long forms and the
#   informal ones, and an English spelling where it is neither a word of `name_en`
#   nor something `translit` can spell back («Zabaikalye»). `cities` are a few large towns, so that «Тольятти» finds Самарская.
#   Both are search hints for the phone, never shown as a region's name.
#
# Nothing in this file may describe signing in on a diary's own page inside the app:
# there is no such surface (the decision record, §1), and
# `test_only_petersburg_and_password_netschool_are_signable` reads this file too.

[survey]
# The month the survey describes; `docs/diaries.md`'s regions table says it in its
# header («In use now (September 2026)») and the generator holds the two equal.
month = "2026-09"

# ---------------------------------------------------------------------------------
# The lexicon the phone's region search is built from.
#
# It is data rather than Kotlin because every entry is Cyrillic, and `:app` keeps
# Russian out of its source (the `grep` check in CLAUDE.md). The phone lower-cases,
# applies `fold`, turns any other punctuation into a space, drops `stop_words`, and
# also tries the query through the keyboard-layout swap and, for a Latin query,
# through `translit`. `school_words` are what make a query look like a school's name
# rather than a region's — and «школа 5», with nothing distinctive left once they are
# gone, is too common to look up at all.
# ---------------------------------------------------------------------------------
[search]
stop_words = [
    "республика", "респ", "область", "обл", "край", "автономный", "автономная",
    "автономной", "округ", "ао", "аобл", "город", "г", "федерального", "значения",
]
# The same keys in the same places: a query typed with the wrong layout is
# «cfvfhf» for «самара». Position n of one string is position n of the other.
latin_layout = "`qwertyuiop[]asdfghjkl;'zxcvbnm,."
cyrillic_layout = "ёйцукенгшщзхъфывапролджэячсмитьбю"
# Longest first: the phone takes the first pair that matches at each position.
# Best effort, not a standard — «moskva», «kazan», «samara» and «tatarstan» come
# out whole, and a prefix is enough for the search to land. The endings are how
# English writes the Russian ones — «Chuvashia», «Bashkiriya», «Khanty-Mansiysk»,
# «Yakutsk» — and without them a single letter at a time gives «чувашиа»,
# «мансиыск» and «якуцк», which match nothing.
translit = [
    ["shch", "щ"], ["sch", "щ"], ["iya", "ия"], ["tsk", "тск"],
    ["zh", "ж"], ["kh", "х"], ["ts", "ц"], ["ch", "ч"],
    ["sh", "ш"], ["yo", "ё"], ["yu", "ю"], ["ya", "я"], ["ye", "е"],
    ["ia", "ия"], ["iy", "ий"], ["yy", "ый"],
    ["a", "а"], ["b", "б"], ["c", "к"], ["d", "д"], ["e", "е"], ["f", "ф"], ["g", "г"],
    ["h", "х"], ["i", "и"], ["j", "й"], ["k", "к"], ["l", "л"], ["m", "м"], ["n", "н"],
    ["o", "о"], ["p", "п"], ["q", "к"], ["r", "р"], ["s", "с"], ["t", "т"], ["u", "у"],
    ["v", "в"], ["w", "в"], ["x", "кс"], ["y", "ы"], ["z", "з"],
]
# The words a school's name is made of rather than distinguished by. The server's
# directory answers «too common to place» for a query that is nothing else plus a
# number of one or two digits, and the phone asks the same question before it spends
# a search; this is the one list both read.
school_words = [
    "школа", "сош", "оош", "нош", "гимназия", "лицей", "центр", "образования", "мбоу",
    "маоу", "моу", "мкоу", "гбоу", "гоу", "чоу", "средняя", "основная",
    "общеобразовательная", "№", "n", "no", "номер",
]

# What an English word typed may stand for among the words of an English name.
# «St» is how «Saint» is abbreviated, and «region» is what English calls an oblast
# or a krai. The word typed is still tried as itself. «oblast» is deliberately not a
# stop word the way «область» is: «moscow» would then tie Moscow Oblast with Moscow,
# and a tie goes to the list's order rather than to the city somebody meant.
[search.synonyms]
st = ["saint"]
region = ["oblast", "krai"]

[search.fold]
"ё" = "е"
"‐" = " "
"‑" = " "
"‒" = " "
"–" = " "
"—" = " "
"−" = " "
"-" = " "

# ---------------------------------------------------------------------------------
# Platforms: one per page under docs/diaries/, except myschool-federal.md, which
# describes two different things under three labels — ТОР «Моя школа», the diary
# reached through Госуслуги, and ФГИС «Моя школа», the federal portal that is not a
# diary at all. A system linking that page is told apart by `host`, never by label.
#
# `kind`:   diary | portal | admissions | none (Севастополь's paper registers).
# `signin`: how the platform's own users get in, for reading only — password, mixed
#           (it depends on the region), esia_only, oauth, retired, unknown, none.
#           It never decides anything; `action` in the output does, and it comes
#           from the provider registry and the allow-list, not from this word.
# `provider` is not written here: a platform is backed by a provider exactly when its
# key is one of `app.providers.diary.registry.KEYS`.
