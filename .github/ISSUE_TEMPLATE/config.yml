# Пустой issue оставлен включённым намеренно: приложение умеет открыть
# «новый issue» в браузере с уже заполненными заголовком и телом
# (SupportSheets.kt, issues/new?title=&body=), и выбор шаблона встал бы поперёк
# этого пути ровно там, где человек уже написал текст.
blank_issues_enabled: true

contact_links:
  - name: Уязвимость
    url: https://github.com/lumenpearson/lessons/security/advisories/new
    about: Не открывайте публичный issue. Сообщите приватно через security advisory.
  - name: Не собирается APK или не работает подпись
    url: https://github.com/lumenpearson/lessons/blob/main/docs/build.md
    about: Сборка в Actions, свой ключ, релиз по тегу и подключение приложения к серверу.
  - name: Не запускается сервер или бот
    url: https://github.com/lumenpearson/lessons/blob/main/docs/deploy.md
    about: Vercel + Neon или свой сервер, webhook, миграции и почему у сервера нет своих часов.
