name: Proposal
description: Propose a new capability, or a change to how something behaves
labels: ["type:feature", "status:next"]
body:
  - type: markdown
    attributes:
      value: |
        The README has an "Honest status" section listing both what the project
        deliberately does not have and what has not been verified yet. Have a look:
        your proposal may already be there, in which case it is more useful to say how
        you need it than to propose it again.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have looked at "Honest status" in the README and at the open issues
          required: true

  - type: dropdown
    id: area
    attributes:
      label: What it concerns
      options:
        - App — screens
        - App — widget
        - App — notifications
        - Telegram bot
        - Server / API
        - Petersburg electronic diary
        - Documentation
        - Several at once
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem this solves
      description: Describe what a person cannot do, rather than jumping to an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What it could look like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered

  - type: checkboxes
    id: constraints
    attributes:
      label: What it touches
      description: |
        Not a prohibition, a question for discussion: these four things are arranged the
        way they are on purpose, and a proposal that changes one is worth discussing
        before any code.
      options:
        - label: Something would have to happen by itself on a clock on the server (nothing runs between requests on Vercel — only a tick from outside)
        - label: The bot would need a new capability — otherwise it will not exist, because there is no other admin surface
        - label: The widget would have to show something new (what it draws depends on its size, and there are twelve rungs)
        - label: The network would be needed where the app currently manages from the Room cache

  - type: textarea
    id: language
    attributes:
      label: Text the user will see
      description: |
        The interface is Russian, with an English translation. If the proposal adds any
        wording, propose both — the Russian and the English.
