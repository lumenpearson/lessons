name: Предложение
description: Предложить новую возможность или изменить поведение
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        В README есть раздел «Честный статус» — там перечислено и то, чего в проекте нет
        намеренно, и то, что пока не проверено. Загляните туда: возможно, ваше
        предложение уже там, и тогда полезнее рассказать, как оно нужно вам, чем
        предлагать его заново.

  - type: checkboxes
    id: preflight
    attributes:
      label: Перед отправкой
      options:
        - label: Я посмотрел «Честный статус» в README и открытые issue
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Чего касается
      options:
        - Приложение — экраны
        - Приложение — виджет
        - Приложение — уведомления
        - Бот в Telegram
        - Сервер / API
        - Электронный дневник Петербурга
        - Документация
        - Несколько сразу
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опишите, что не получается у человека, а не сразу реализацию.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Как это могло бы выглядеть
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Что ещё вы рассматривали

  - type: checkboxes
    id: constraints
    attributes:
      label: Что это задевает
      description: |
        Не запрет, а вопрос к обсуждению: эти четыре вещи в проекте устроены так
        осознанно, и предложение, которое их меняет, стоит обсудить до кода.
      options:
        - label: Нужно, чтобы что-то происходило само по часам на сервере (на Vercel между запросами не выполняется ничего — только тик снаружи)
        - label: Нужна новая возможность у бота — иначе её не будет, потому что другой админки нет
        - label: Виджет должен показывать что-то новое (содержимое зависит от размера, и рунгов двенадцать)
        - label: Нужна сеть там, где сейчас приложение обходится кэшем Room

  - type: textarea
    id: language
    attributes:
      label: Текст, который увидит пользователь
      description: |
        Интерфейс русский, с английским переводом. Если предложение добавляет надписи —
        предложите обе, по-русски и по-английски.
