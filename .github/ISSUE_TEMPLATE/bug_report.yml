name: Bug
description: Something behaves wrongly — in the app, the widget, the bot or on the server
labels: ["type:bug", "status:next"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. One request: **do not publish the bot token, a class
        code, an electronic-diary password or a calendar link here** — replace them with
        `<redacted>`. An issue is public, and a token from a public issue has to be
        revoked.

        You can also send a report straight from the app: "Настройки → О приложении →
        Сообщить об ошибке". The table about the device is already filled in there.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: No similar issue has been opened yet
          required: true
        - label: The text carries no tokens, passwords or class code
          required: true
        - label: I have looked at the "Honest status" section of the README — this is not something already named there as unverified
          required: false

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - App — screens
        - App — widget
        - App — notifications
        - App — Petersburg electronic diary
        - Telegram bot
        - Server / API
        - APK build, Actions
        - I do not know
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: 'Open "Настройки → О приложении" in the app. For the server, a commit or a tag.'
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 6a, Android 15

  - type: input
    id: widget-size
    attributes:
      label: Widget size
      description: If the widget is the problem — how many cells it occupies. What it draws depends on its size.
      placeholder: 4×2

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - Russian
        - English
        - Same as the phone

  - type: input
    id: timezone
    attributes:
      label: The class's time zone
      description: 'In the bot: "⚙️ Класс → 🕒 Часовой пояс". It matters for everything to do with time.'
      placeholder: Europe/Moscow

  - type: textarea
    id: logs
    attributes:
      label: Logs, the server's answer, the output of the command that failed
      description: Replace secrets with `<redacted>`.
      render: shell

  - type: dropdown
    id: regression
    attributes:
      label: Did it work before?
      options:
        - I do not know
        - Yes, it broke in some version
        - No, it never worked
