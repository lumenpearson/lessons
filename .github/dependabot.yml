version: 2

# Три экосистемы, и ни одной npm: в репозитории нет Node вовсе.
#
#   gradle  -> android/         (settings.gradle.kts и gradle/libs.versions.toml)
#   pip     -> server/          (pyproject.toml, полный набор с dev)
#   pip     -> /               (requirements.txt, который ставит Vercel)
#   actions -> /               (.github/workflows)
#
# Версии Android-зависимостей в libs.versions.toml не выдуманы, а перенесены из
# проектов, которые на них собираются; заголовок каталога называет источник
# каждой. Поэтому обновления сгруппированы и ограничены: пять открытых PR с
# альфами Compose, приехавшие по одной, — это не обновление, а лотерея.
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    groups:
      androidx:
        patterns:
          - androidx.*
      testing:
        patterns:
          - junit:*
          - org.robolectric:*
      network:
        patterns:
          - com.squareup.retrofit2:*
          - com.squareup.okhttp3:*
          - org.jetbrains.kotlinx:kotlinx-serialization*
    ignore:
      # AGP, Kotlin и KSP двигаются только вместе и только руками: AGP 9
      # компилирует Kotlin сам, а версия KSP привязана к версии компилятора.
      # Разъехавшаяся тройка — не предупреждение, а несобирающийся проект.
      - dependency-name: com.android.*
        update-types: ["version-update:semver-major"]
      - dependency-name: org.jetbrains.kotlin*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: com.google.devtools.ksp*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Material 3 Expressive и Glance стоят на альфах намеренно: приложение
      # построено на Expressive, а виджет — на Glance 1.3.0-alpha02, и следующая
      # альфа меняет API без предупреждения. Обновляются вместе с проверкой
      # сборки, а не автоматически.
      - dependency-name: androidx.compose.material3:material3
      - dependency-name: androidx.glance:*

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - server
    groups:
      testing:
        patterns:
          - pytest*
          - ruff
      runtime:
        patterns:
          - fastapi
          - uvicorn*
          - pydantic*
          - sqlalchemy*
          - alembic
          - httpx
          - asyncpg
          - aiosqlite

  # Тот же набор, второй файл: Vercel ставит зависимости из корневого
  # requirements.txt, потому что его сборщик Python не читает pyproject.toml из
  # подкаталога. Расхождение между двумя файлами — это разница между тем, что
  # проверено тестами, и тем, что выполняется в бою, поэтому обновлять надо оба.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - server
      - vercel

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
