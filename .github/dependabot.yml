version: 2

# Four ecosystems and no npm: there is no Node in this repository at all.
#
#   gradle  -> android/         (settings.gradle.kts and gradle/libs.versions.toml)
#   pip     -> server/          (pyproject.toml, the full set including dev)
#   uv      -> /               (requirements.in and its lock, requirements.txt,
#                               which is what Vercel installs)
#   actions -> /               (.github/workflows)
#
# The Android versions in libs.versions.toml are not invented: they are carried
# over from projects that build on them, and the catalog's header names the
# source of each. That is why updates are grouped and capped — five open pull
# requests carrying Compose alphas one at a time is a lottery, not an update.
#
# The labels are the project's own families, `type:` and `area:`, and each one
# has to exist already: Dependabot skips a label the repository does not have,
# without a word. It asked for `dependencies`, `android`, `server`, `vercel`
# and `ci` for months, none of which existed, and every bump arrived bare
# (#162).
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - type:chore
      - area:android
    groups:
      androidx:
        patterns:
          - androidx.*
      testing:
        patterns:
          - junit:*
          - org.robolectric:*
      network:
        patterns:
          - com.squareup.retrofit2:*
          - com.squareup.okhttp3:*
          - org.jetbrains.kotlinx:kotlinx-serialization*
    ignore:
      # AGP, Kotlin and KSP move together and only by hand: AGP 9 compiles
      # Kotlin itself, and the KSP version is tied to the compiler's. The three
      # drifting apart is not a warning, it is a project that does not build.
      - dependency-name: com.android.*
        update-types: ["version-update:semver-major"]
      - dependency-name: org.jetbrains.kotlin*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: com.google.devtools.ksp*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Material 3 Expressive and Glance sit on alphas deliberately: the app is
      # built on Expressive and the widget on Glance 1.3.0-alpha02, and the next
      # alpha changes the API without warning. They are updated together with a
      # build check, not automatically.
      - dependency-name: androidx.compose.material3:material3
      - dependency-name: androidx.glance:*

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - type:chore
      - area:server
    groups:
      testing:
        patterns:
          - pytest*
          - ruff
      runtime:
        patterns:
          - fastapi
          - uvicorn*
          - pydantic*
          - sqlalchemy*
          - alembic
          - httpx
          - asyncpg
          - aiosqlite

  # The lock Vercel installs: requirements.txt, compiled by `uv pip compile`
  # from requirements.in (#192). `uv` rather than `pip`, because the uv updater
  # is the one that regenerates a uv-compiled file with uv, and it re-reads
  # `--python-version` from the lock's header; the pip updater would rerun it
  # with pip-compile. It does not re-read `--python-platform`, and does not
  # need to: it runs on Linux, the platform the header names.
  #
  # A bump of a package requirements.in names also raises its floor there,
  # and pyproject.toml is not in this directory — test_requirements_mirror
  # fails and names it, and the floor is raised in pyproject.toml by hand
  # (the github-pr skill, "Dependabot's pull requests"). A bump of anything
  # else touches the lock alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - type:chore
      - area:server

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - type:chore
      - area:ci
