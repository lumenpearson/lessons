name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you build from the Actions tab without pushing anything.
  workflow_dispatch:

# Read-only. These jobs run ./gradlew on pull-request code, and a Gradle build
# script executes arbitrary code at configuration time; on an older repository
# the default token would hand that code write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository this change can possibly have broken.
  #
  # The Android job is ten minutes and the server job is two; a commit that
  # edits only `docs/` used to pay both. This job costs a few seconds and
  # decides, as three outputs, which of Android, the server and the contract
  # check has anything to do.
  #
  # It fails open on purpose. If the range cannot be worked out — a force push,
  # a first push of a branch, a re-run after history moved — every job runs.
  # A wasted ten minutes is an annoyance; a change that skipped the build that
  # would have caught it is a bad release.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request needs its base to diff against; a push needs the
          # commit before it. Both are cheap on a repository this size.
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          range=""
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=200 origin "$BASE_REF" || true
            if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
              range="FETCH_HEAD...HEAD"
            fi
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..HEAD"
            fi
          fi

          if [ -z "$range" ]; then
            echo "::notice::Change range unknown; building everything."
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$range")
          echo "Changed files:"
          echo "$files"

          # The workflow files themselves count as all three: a change to how
          # the build runs has to be proved by running it.
          android=false
          server=false
          contract=false
          while IFS= read -r file; do
            case "$file" in
              # `docs/app/` is Android: `:core:data` packages it as assets
              # (core/data/build.gradle.kts) and `DocsGuideParityTest` holds the
              # two guides level page for page. A commit touching only
              # `guide.ru.md` set neither output, both jobs were skipped by
              # their `if:`, and the workflow was green with nothing having run
              # — which is how the Russian guide grows a page the English one
              # does not have, and an English reader gets a toolbar with a
              # different number of buttons and nothing logged.
              # `docs/legal/` is the same case: `:app` packages it as assets
              # and `LegalDocumentsTest` holds the two languages level. The
              # region catalog and the protocol vectors live under `server/`
              # but are Android inputs too — the catalog is the phone's
              # allow-list of diary hosts, bundled in place, and the vectors
              # are `DiaryProtocolVectorsTest`'s resource — so an edit to
              # either must run both halves, not only the server's.
              android/*|docs/app/*|docs/legal/*|server/app/catalog/data/*|server/tests/vectors/*|.github/workflows/*) android=true ;;
            esac
            case "$file" in
              # Server tests read files outside `server/`, and a commit touching
              # only one of them ran nothing and came back green (#159, #295).
              # Every Markdown file a reader learns the migration head from —
              # `README.md`, `CLAUDE.md`, `AGENTS.md`,
              # `.github/copilot-instructions.md`, and all of `docs/` and
              # `.claude/` but `docs/history.md` — is read by
              # test_schema_version, which fails on one that names an old head;
              # `docs/*.md` and `.claude/*.md` reach every depth, because a
              # `case` `*` crosses `/`. Among them `docs/build.md` is also read
              # by test_env_example, `docs/deploy.md` by
              # test_corrections_per_child_revision, and `docs/diaries.md` and
              # `docs/diaries/` are the region catalog's input
              # (test_region_catalog). `proto/` is read by test_contract,
              # test_contract_json and test_contract_mirror, which read the
              # source, comments included, where the «Contract» job checks only
              # what is generated from it. test_contract holds `buf.yaml` and
              # `buf.gen.yaml`, with its plugin pins, level with the runtime
              # floors in `requirements.in`, and `buf.lock`'s googleapis commit
              # level with `buf.gen.yaml`'s input; the input of the lock
              # `requirements.txt`; test_requirements_mirror holds those two
              # level with pyproject.toml and the lock with `.python-version`.
              # `docker-compose.yml` is read by test_compose, which is all that
              # checks it: nothing here runs Docker. `api/` and `vercel.json`
              # are read by test_vercel_entry, `.vercelignore` by
              # test_region_catalog. server/tests/test_ci_paths.py fails on a
              # file the suite reads that this line does not match.
              server/*|api/*|vercel.json|.vercelignore|requirements.txt|requirements.in|.python-version|docker-compose.yml|proto/*|buf.yaml|buf.lock|buf.gen.yaml|README.md|CLAUDE.md|AGENTS.md|.github/copilot-instructions.md|docs/*.md|.claude/*.md|.github/workflows/*) server=true ;;
            esac
            case "$file" in
              # The v2 contract and what is generated from it: the job below.
              # `server/app/contract/` is here as well as under the server,
              # because a hand edit there, with no proto change, is exactly what
              # the regeneration check exists to refuse.
              proto/*|buf.yaml|buf.gen.yaml|buf.lock|server/app/contract/*|.github/workflows/*) contract=true ;;
            esac
          done <<< "$files"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"

  # The v2 contract (docs/specs/2026-10-04-contract-v2-design.md, «Checks»).
  #
  # Generated code is committed, because Vercel runs no code generation, so a
  # proto change merged without its regenerated Python would deploy the old
  # contract with nothing anywhere saying so. This job regenerates from proto/
  # and fails on any difference. It lints with Buf's STANDARD rules. On a pull
  # request it checks the proto against the base with the FILE category, the
  # mechanical half of «Evolving the contract»: no field renamed, renumbered
  # or retyped in place.
  #
  # Only when the contract changed (the filter above), so every other run pays
  # nothing for it. It reads no secret, like the rest of this file, so a pull
  # request from a fork runs it whole. Buf's remote plugins and the Schema
  # Registry are used unauthenticated, as the spike used them. If Buf ever
  # throttles this job, either step can be the one that fails: the buf-action
  # step fetches googleapis from the Schema Registry before generate runs, and
  # a throttle there fails with Buf's own message and no hint. The remedy is
  # the same either way, a BUF_TOKEN repository secret handed to the buf-action
  # step: the owner's step, docs/build.md, «The v2 contract and Buf».
  contract:
    name: Contract (Buf)
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit has to be here to be asked whether it has a contract.
          fetch-depth: 0

      # On the pull request that adds the contract, the base has no buf.yaml
      # and there is nothing to compare against. That is said, not passed off
      # as a green check.
      - name: Does the base have a contract
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:buf.yaml" 2>/dev/null; then
            echo "proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base of this pull request has no buf.yaml: buf breaking has nothing to compare against and is skipped, not passed."
          fi

      # Buf is pinned by version and by the SHA-256 of the Linux binary the
      # action downloads (the release's sha256.txt), so Buf cannot move without
      # a commit here. The action itself is pinned by its tag, like every other
      # action in these workflows, and a tag is something its owner could move;
      # the job reads no secret and has `contents: read`, which is what bounds
      # that.
      - id: buf
        uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.73.0
          checksum: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
          lint: true
          breaking: ${{ github.event_name == 'pull_request' && steps.base.outputs.proto == 'true' }}
          # Not asked for by the design; the proto files are formatted by hand.
          format: false
          # This repository publishes nothing to the Buf Schema Registry.
          push: false
          archive: false
          # A comment needs pull-requests: write, and this workflow asks for
          # read only.
          pr_comment: false

      - name: Generated code is what proto/ generates
        env:
          BUF: ${{ steps.buf.outputs.buf_path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          if ! "$BUF" generate --output "$out"; then
            echo "::error::buf generate failed. If the log says Buf refused an unauthenticated request (429, resource exhausted), the remote plugins need a BUF_TOKEN repository secret passed to this job: docs/build.md, «The v2 contract and Buf»."
            exit 1
          fi
          if ! diff -r --exclude=__pycache__ "$out/server/app/contract" server/app/contract; then
            echo "::error::server/app/contract is not what proto/ generates. From the repository root run: buf generate, then commit server/app/contract with the proto change."
            exit 1
          fi

  server:
    name: Server (API + bot)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/pyproject.toml
      # The lock and the package in one resolve (#192). The lock is what
      # Vercel installs, so the suite runs on the versions production gets
      # rather than on whatever was newest the morning CI ran — which is how
      # SQLAlchemy 2.1 reached the tests and the deployment unannounced
      # (#164). pyproject.toml adds on top what the function does without:
      # uvicorn, aiosqlite, alembic and the dev tools, which are not locked
      # and still float. A lock that no longer satisfies one of its floors
      # fails here, at the install, rather than in production.
      - name: Install
        run: pip install -r ../requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts migrations
      # One question of the whole server: does anything reach for an attribute
      # its type does not have? «🗓 Четверти» crashed on every press in
      # production because a card printed `term.days` off a type that has
      # none, and this reproduces it; every other error code is switched off
      # by name in pyproject.toml, with its count and its reason. It ran only
      # when somebody remembered to until the owner asked for it here (#210),
      # and it runs against the locked versions installed above, which is
      # where its verdict comes from: SQLAlchemy 2.1 alone made it unclean
      # once, with no change to the code (#164). Fourteen seconds from cold
      # on a laptop.
      - name: Type check
        run: python -m mypy
      # `-n auto`, because this step was the whole run. It was twelve and a
      # half minutes of a twenty-one minute CI run and is now three and a
      # half: that started as a bill to cut and stayed for the feedback. The
      # suite parallelises safely — each xdist worker imports
      # `tests/conftest.py` in its own process, and that import is what names
      # the SQLite file, so the workers never share a database. Measured on
      # four cores: 289 s to 101 s, 1340 passed either way.
      - name: Test
        run: pytest -q -n auto

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Pinned, and told what to install.
      #
      # The action's default `packages` is "tools platform-tools", and `tools`
      # was removed from Google's repository years ago. That used to be a
      # warning; it is now an exit code, so the step dies before Gradle starts
      # and every Android run goes red for a reason that has nothing to do with
      # the commit. Naming platform-tools alone drops the dead package and
      # changes nothing else — licences are still accepted, and the SDK the
      # build needs is on the image.
      #
      # `@v4` floats, which is how this arrived without anything in the
      # repository changing: CI was green at 19:06 and red at 20:28 on the same
      # workflow file. An exact tag means the next such change is one we choose.
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6

      # One invocation, not three.
      #
      # Every `./gradlew` starts a JVM, reads the settings and build scripts and
      # builds a task graph before it runs anything. Asking for the three
      # outcomes separately paid that three times and let Gradle schedule only
      # a third of the work at once; asking for them together gives it one graph
      # to parallelise across the runner's cores, and the library modules'
      # compilation is shared rather than repeated.
      #
      # Release is built on every run, not only at release time. R8 and resource
      # shrinking are the classic source of "worked in debug, broken in the APK
      # people install", and finding that on a pull request costs minutes rather
      # than a bad release.
      #
      # It was briefly moved off pull requests to save billed minutes, and moved
      # back when the repository went public and standard runners stopped being
      # billed at all. Worth remembering if it is ever private again: the gate
      # is worth about two minutes a push.
      #
      # `assemble` does not depend on `test`, so a parallel build can finish an
      # APK before a failing test is reported. The invocation still fails and
      # the job with it; the APK uploads below are skipped.
      #
      # No `--no-daemon`: the daemon is Gradle's own recommendation for CI and
      # the flag costs a cold JVM for nothing. `setup-gradle` stops it at the
      # end of the job, and the job ends with the runner anyway.
      - name: Test and assemble
        run: ./gradlew test assembleDebug assembleRelease

      # `always()`, because the report is worth most exactly when the step
      # before it failed: it names the test and shows the assertion without a
      # second ten-minute run.
      #
      # `continue-on-error`, because the gate is `./gradlew test`, not this.
      # A build whose tests all passed must not be reported red because a
      # diagnostic could not be stored — which is exactly what a full artifact
      # store did here, for a reason that was not in the diff and could not be
      # fixed from it. The step still goes red in the run, so the reason stays
      # visible rather than swallowed.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/**/build/reports/tests/**
          if-no-files-found: ignore

      # No `retention-days` on any upload here, and that is a correction
      # rather than a simplification. These asked for a week — short on
      # purpose, because a 27 MB debug APK and a 5 MB release APK per run is
      # how this repository put every upload into "Artifact storage quota has
      # been hit" while it was private, a red job on a build that passed, and
      # nobody has ever wanted the APK of a pull request from two months ago.
      # But the repository's own artifact retention is lower than a week, so
      # the seven was never what happened: every run reduced it and said so in
      # a warning, and the number here was a wish rather than a setting. The
      # repository setting is the one that decides, for this workflow and for
      # `apk.yml` alike; it is in Settings -> Actions -> General.
      #
      # `if-no-files-found: error` on both: it is the check that the build
      # produced what it claims.
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned-key
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Static analysis of the Kotlin (#210): detekt over every module's
      # sources, without type resolution, failing on any finding that the
      # module's `detekt-baseline.xml` does not already record. docs/build.md,
      # "detekt", says what it checks and what it cannot.
      #
      # A step of its own rather than a fourth task in the invocation above,
      # which is where the cost argument would put it. That invocation has no
      # `--continue`, and detekt's tasks depend on nothing, so they would run
      # first — and one finding would stop Gradle from scheduling the tests at
      # all: a style verdict hiding a test verdict. Here it costs the analysis
      # itself, under half a minute for the five modules on a laptop, and one
      # configuration on the daemon "Test and assemble" left warm.
      #
      # Last, and `success() || failure()`, so that it still answers on a run
      # whose build failed and can never cost a run its APKs.
      - name: Detekt
        if: success() || failure()
        run: ./gradlew detekt
