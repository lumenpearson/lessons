name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you build from the Actions tab without pushing anything.
  workflow_dispatch:

# Read-only. These jobs run ./gradlew on pull-request code, and a Gradle build
# script executes arbitrary code at configuration time; on an older repository
# the default token would hand that code write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which halves of the repository this change can possibly have broken.
  #
  # The Android job is ten minutes and the server job is two; a commit that
  # edits only `docs/` used to pay both. This job costs about fifteen seconds
  # and decides which of them has anything to do.
  #
  # It fails open on purpose. If the range cannot be worked out — a force push,
  # a first push of a branch, a re-run after history moved — both halves run.
  # A wasted ten minutes is an annoyance; a change that skipped the build that
  # would have caught it is a bad release.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request needs its base to diff against; a push needs the
          # commit before it. Both are cheap on a repository this size.
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          range=""
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=200 origin "$BASE_REF" || true
            if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
              range="FETCH_HEAD...HEAD"
            fi
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..HEAD"
            fi
          fi

          if [ -z "$range" ]; then
            echo "::notice::Change range unknown; building everything."
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$range")
          echo "Changed files:"
          echo "$files"

          # The workflow files themselves count as both: a change to how the
          # build runs has to be proved by running it.
          android=false
          server=false
          while IFS= read -r file; do
            case "$file" in
              android/*|.github/workflows/*) android=true ;;
            esac
            case "$file" in
              server/*|api/*|requirements.txt|.github/workflows/*) server=true ;;
            esac
          done <<< "$files"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

  server:
    name: Server (API + bot)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts migrations
      # `-n auto`, because this step was the bill. A full run of this workflow
      # costs about twenty-one billed minutes and twelve and a half of them
      # were here — GitHub rounds each job up to a whole minute, so the only
      # thing that saves anything is finishing sooner. The suite parallelises
      # safely: each xdist worker imports `tests/conftest.py` in its own
      # process, and that import is what names the SQLite file, so the workers
      # never share a database. Measured on four cores: 289 s to 101 s, 1340
      # passed either way.
      - name: Test
        run: pytest -q -n auto

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Pinned, and told what to install.
      #
      # The action's default `packages` is "tools platform-tools", and `tools`
      # was removed from Google's repository years ago. That used to be a
      # warning; it is now an exit code, so the step dies before Gradle starts
      # and every Android run goes red for a reason that has nothing to do with
      # the commit. Naming platform-tools alone drops the dead package and
      # changes nothing else — licences are still accepted, and the SDK the
      # build needs is on the image.
      #
      # `@v4` floats, which is how this arrived without anything in the
      # repository changing: CI was green at 19:06 and red at 20:28 on the same
      # workflow file. An exact tag means the next such change is one we choose.
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6

      # One invocation, not three.
      #
      # Every `./gradlew` starts a JVM, reads the settings and build scripts and
      # builds a task graph before it runs anything. Asking for the three
      # outcomes separately paid that three times and let Gradle schedule only
      # a third of the work at once; asking for them together gives it one graph
      # to parallelise across the runner's cores, and the library modules'
      # compilation is shared rather than repeated.
      #
      # Release is built on merges and on demand, not on every pull-request
      # push. R8 and resource shrinking are the classic source of "worked in
      # debug, broken in the APK people install", so the gate stays — it just
      # stands at the merge and at the tag (`apk.yml` runs `test
      # assembleRelease` on every `v*`) instead of at each of the five pushes
      # a pull request takes to get there. That is a real trade and it is
      # bought with minutes: the free allowance is 2000 a month, every job is
      # rounded up to a whole one, and this workflow was spending about
      # twenty-one of them per run. Put `assembleRelease` back on the
      # pull-request line if a broken shrinker ever reaches `main`.
      #
      # `assemble` does not depend on `test`, so a parallel build can finish an
      # APK before a failing test is reported. The invocation still fails and
      # the job with it; the APK uploads below are skipped.
      #
      # No `--no-daemon`: the daemon is Gradle's own recommendation for CI and
      # the flag costs a cold JVM for nothing. `setup-gradle` stops it at the
      # end of the job, and the job ends with the runner anyway.
      - name: Test and assemble
        env:
          # Via env rather than interpolated into the script: the same habit as
          # everywhere else in these workflows, even where the value is ours.
          WITH_RELEASE: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$WITH_RELEASE" = "true" ]; then
            ./gradlew test assembleDebug assembleRelease
          else
            ./gradlew test assembleDebug
          fi

      # `always()`, because the report is worth most exactly when the step
      # before it failed: it names the test and shows the assertion without a
      # second ten-minute run.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/**/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Only where one was built. `if-no-files-found: error` is kept on
      # purpose: it is the check that the build produced what it claims, and
      # it would otherwise fail every pull request now that the release APK
      # is not built there.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned-key
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
