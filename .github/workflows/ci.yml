name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you build from the Actions tab without pushing anything.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (API + bot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest -q

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon test
      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # Release is built on every run, not only at release time. R8 and resource
      # shrinking are the classic source of "worked in debug, broken in the APK
      # people install", and finding that on a pull request costs minutes rather
      # than a bad release.
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-key
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
