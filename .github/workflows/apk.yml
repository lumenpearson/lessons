# Build an installable APK on demand.
#
# Two ways in:
#   * Actions -> "APK" -> "Run workflow", pick a build type. Nothing to push.
#   * push a tag like v0.2.0, which additionally publishes a GitHub Release
#     with the APK attached.
#
# Signing: if the four keystore secrets are set the release APK is signed with
# your key. If they are not, it is signed with the debug key so it still
# installs; the job summary says which happened. See docs/build.md.
name: APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: release
        options: [release, debug, both]
      version_name:
        description: "versionName to stamp (blank = the value in build.gradle.kts)"
        type: string
        required: false
      version_code:
        description: "versionCode to stamp (blank = this run's number)"
        type: string
        required: false
  push:
    tags: ["v*"]

# Needed only by the tag path, which creates a Release.
permissions:
  contents: write

# Queue, never cancel. cancel-in-progress is right for branch CI, where only
# the newest commit matters and killing a stale run saves minutes. It is wrong
# here: this workflow exists to hand somebody an artifact, so a second press of
# the button - or a tag pushed while a manual build is running - would destroy
# a build a person is actively waiting on. Two presses now produce two APKs,
# one after the other.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # A stuck Gradle daemon or a runner that loses its network would otherwise
    # sit here for the six hours GitHub allows, on a workflow somebody is
    # waiting on.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Same pin and the same reason as ci.yml: the action's default `packages`
      # asks for the long-dead `tools`, which now exits non-zero, and `@v4`
      # floats. A release build that cannot start is worse than a red PR.
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6

      # A tag stamps its own version; a manual run may pass one; otherwise the
      # build file's default stands.
      #
      # versionCode defaults to the run number, which advances on its own so two
      # APKs are never mistaken for each other — but it is only a default now.
      # It used to be the whole rule, and it overrode `lessons.versionCode`
      # without saying so anywhere: a number raised in build.gradle.kts was
      # discarded, and the only visible version was the name, which Android does
      # not compare. An explicit input wins, and it is validated, because a
      # versionCode that is not a positive integer is a build failure several
      # minutes in.
      - name: Resolve version
        id: version
        env:
          # Via env, never interpolated into the script: a workflow_dispatch
          # input is attacker-controlled text as far as the shell is concerned.
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            NAME="$INPUT_VERSION_NAME"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME=""
          fi
          if [ -n "$INPUT_VERSION_CODE" ]; then
            case "$INPUT_VERSION_CODE" in
              ''|*[!0-9]*)
                echo "::error::version_code must be a positive whole number."
                exit 1
                ;;
            esac
            # Both bounds, and the upper one is the whole point: the digits
            # check above passes 2147483648 happily, and the build used to
            # stamp versionCode 1 for it without a word. 2100000000 is Google
            # Play's ceiling, which is below Int's own; build.gradle.kts
            # refuses the same range, so a build run any other way fails too.
            if [ "$INPUT_VERSION_CODE" -lt 1 ] || [ "$INPUT_VERSION_CODE" -gt 2100000000 ]; then
              echo "::error::version_code must be between 1 and 2100000000."
              exit 1
            fi
            CODE="$INPUT_VERSION_CODE"
          else
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret; the release APK will be signed with the debug key and must not be published."
            exit 0
          fi
          # All four, not just the file. Gradle's `hasReleaseSigning` needs the
          # keystore, its password, the alias and the key's password, and falls
          # back to the AGP debug key with only a `logger.warn` when any one is
          # missing — while this step used to report `signed=true` on the file
          # alone. Name the alias secret KEYSTORE_ALIAS instead of KEY_ALIAS,
          # or leave KEY_PASSWORD unset trusting "the passwords are the same",
          # and `git push origin v0.2.0` published a debug-signed APK to a
          # public release under a summary that called it signed. The debug key
          # is generated on the machine that builds and thrown away with it:
          # the alias and passwords are constants, the key pair is not. So such
          # a release can never be updated — by anybody, this project included,
          # because nobody holds the key it was signed with — and its
          # certificate says only `CN=Android Debug`, which is what every other
          # debug build on Earth also says.
          missing=""
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::KEYSTORE_BASE64 is set but$missing is empty. Release signing would silently fall back to the debug key; see docs/build.md."
            exit 1
          fi
          # Outside the workspace so it can never be picked up by an upload glob.
          #
          # `\r` is stripped and `\n` is not, because the two fail differently:
          # base64 ignores a newline, so a value wrapped at 76 characters
          # decodes fine, while a carriage return picked up by copying out of a
          # terminal is garbage to it and kills the whole decode. Stripping both
          # costs nothing and removes the difference.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            # `base64: invalid input` is what this said before, and it names
            # neither the secret, nor this workflow, nor what to do — the exact
            # shape of error the keystore checks above exist to replace. The
            # value is never echoed: it is the signing key.
            rm -f "$RUNNER_TEMP/release.jks"
            # The length is the diagnosis, and its remainder modulo four is
            # most of it: base64 always comes in groups of four, so anything
            # else means characters are gone from the end. Two short is the
            # «==» padding, which is exactly what a selection that stops one
            # gesture early loses — and a value two characters short still
            # looks the right size, which is why «about 3000-6000» said here
            # before was no help at all.
            remainder=$(( ${#KEYSTORE_BASE64} % 4 ))
            if [ "$remainder" -ne 0 ]; then
              why="it is ${#KEYSTORE_BASE64} characters, which is $remainder more than a multiple of four - so the end is missing, most often the trailing '=' padding"
            else
              why="it is ${#KEYSTORE_BASE64} characters, a multiple of four, so something inside it is not a base64 character"
            fi
            echo "::error::KEYSTORE_BASE64 is set but is not valid base64, so the keystore could not be rebuilt: $why. Set it without selecting anything by hand: gh secret set KEYSTORE_BASE64 --body \"\$(base64 your.jks | tr -d '\\n\\r')\". See docs/build.md."
            exit 1
          fi
          # A value that decoded into something that is not a keystore, or a
          # password that does not open it, fails eight minutes later inside
          # Gradle and blames the password either way. `keytool` is already on
          # this runner - `setup-java` ran four steps ago - so ask it now.
          #
          # The password goes in on stdin, not as `-storepass`: an argument is
          # readable in the process list by anything else on the machine, and
          # keytool prompts for it anyway.
          if ! printf '%s\n' "$KEYSTORE_PASSWORD" \
              | keytool -list -keystore "$RUNNER_TEMP/release.jks" > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/release.jks"
            echo "::error::The keystore was rebuilt from KEYSTORE_BASE64 but keytool cannot open it. Either KEYSTORE_PASSWORD is wrong, or the base64 is of some other file, or it was truncated in a way that still decoded. See docs/build.md."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # A ::warning:: cannot fail a job, so an absent keystore fell through to
      # the debug key — and the publish step was gated on the tag alone. A tag
      # pushed before the secrets were configured would attach a debug-signed
      # APK to a public release: anonymous (`CN=Android Debug`, like every other
      # debug build) and impossible to update, because the key that signed it
      # was generated on that runner and died with it. Checked before the build,
      # so a misconfigured release fails in seconds rather than after eight
      # minutes of compiling.
      - name: Refuse to publish an unsigned release
        if: github.ref_type == 'tag' && steps.keystore.outputs.signed != 'true'
        run: |
          echo "::error::Release signing is not configured; refusing to publish $GITHUB_REF_NAME."
          exit 1

      # The tag path used to go straight from checkout to `gh release create`,
      # so `git push --tags` on a commit that never saw a pull request shipped a
      # public release whose unit tests had never been run. They now run inside
      # the build step below, in the same Gradle invocation.
      - name: Build
        env:
          LESSONS_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          LESSONS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LESSONS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LESSONS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LESSONS_VERSION_NAME: ${{ steps.version.outputs.name }}
          LESSONS_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Two optional build properties that each switch a button on, and
          # switch nothing else. Neither was passed here for the whole life of
          # this workflow, so every APK it has ever built had both empty: the
          # «Войти через GitHub» row was hidden by `githubConfigured`, and with
          # it the only way to file a bug report from inside the app, and
          # «Отправить письмом» was hidden too. Nothing said so — that is what
          # the summary below is for. The client id is not a secret (the device
          # flow has none, and an APK could not keep one), but it is the
          # builder's to give, so it lives in the repository's secrets beside
          # the address.
          LESSONS_GITHUB_CLIENT_ID: ${{ secrets.LESSONS_GITHUB_CLIENT_ID }}
          LESSONS_CONTACT_EMAIL: ${{ secrets.LESSONS_CONTACT_EMAIL }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          case "$INPUT_BUILD_TYPE" in
            debug)   TASKS="assembleDebug" ;;
            both)    TASKS="assembleDebug assembleRelease" ;;
            *)       TASKS="assembleRelease" ;;
          esac
          echo "Running: test $TASKS"
          # The tests run in the same invocation as the assemble, not in a step
          # of their own: one JVM, one configuration phase, one task graph for
          # Gradle to parallelise. The gate is unchanged. `assemble` does not
          # depend on `test`, so a parallel build may well finish an APK before
          # the failing test is reported — but the invocation fails, the job
          # fails with it, and every step that uploads or publishes is skipped.
          # What the APK is never allowed to be is published untested.
          #
          # The daemon is left on. Gradle recommends it for CI, and the flag
          # that turned it off bought a cold JVM and nothing else.
          ./gradlew test $TASKS

      # Deleted before anything is uploaded, so a misconfigured glob cannot
      # publish the signing key.
      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/apks/" \;
          ls -la "$RUNNER_TEMP/apks/"
          echo "count=$(find "$RUNNER_TEMP/apks" -name '*.apk' | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: lessons-apk
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: github.ref_type == 'tag' && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP"/apks/*.apk

      - name: Summary
        if: always()
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          # Through the environment, like the "Resolve version" step above and
          # for the reason written there: a workflow_dispatch input is
          # attacker-controlled text as far as the shell is concerned, and this
          # job holds `contents: write`. It was spliced straight into bash here
          # while the step that was written to be careful about it sat twenty
          # lines up.
          VERSION_NAME: ${{ steps.version.outputs.name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          # Tested for emptiness and never printed. What the summary says is
          # «on» or «off», which is the question somebody looking for a missing
          # button is actually asking.
          GITHUB_CLIENT_ID: ${{ secrets.LESSONS_GITHUB_CLIENT_ID }}
          CONTACT_EMAIL: ${{ secrets.LESSONS_CONTACT_EMAIL }}
        run: |
          if [ -n "$INPUT_VERSION_CODE" ]; then
            CODE_SOURCE=" (given)"
          else
            CODE_SOURCE=" (this run's number)"
          fi
          # A feature that is off is a button that is not on the screen, and an
          # absent button explains itself to nobody. Said here rather than left
          # to be discovered on a phone.
          if [ -n "$GITHUB_CLIENT_ID" ]; then
            SIGN_IN="on"
          else
            SIGN_IN="**off** - no \`LESSONS_GITHUB_CLIENT_ID\` secret, so «Войти через GitHub» and filing a bug report from the app are not in this build"
          fi
          if [ -n "$CONTACT_EMAIL" ]; then
            EMAIL="on"
          else
            EMAIL="**off** - no \`LESSONS_CONTACT_EMAIL\` secret, so «Отправить письмом» is not in this build"
          fi
          {
            echo "## APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Build type | \`$INPUT_BUILD_TYPE\` |"
            echo "| versionName | \`${VERSION_NAME:-default from build.gradle.kts}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\`$CODE_SOURCE |"
            echo "| APKs produced | ${{ steps.collect.outputs.count }} |"
            echo "| Sign in with GitHub | $SIGN_IN |"
            echo "| Report by email | $EMAIL |"
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "| Signing | your release keystore |"
            else
              echo "| Signing | **debug key** - installable, but do not publish |"
            fi
            echo
            echo "Download it from the **lessons-apk** artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
