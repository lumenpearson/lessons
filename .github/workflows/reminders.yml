name: Reminders

# The server has no scheduler of its own - on Vercel nothing runs between
# requests - so this workflow is the clock that sends the morning and evening
# digests. It only calls the tick endpoint; deciding what is due, and sending
# each digest exactly once, is the server's job (app/services/reminders.py).
#
# GitHub runs scheduled workflows on a best-effort basis: a tick can arrive
# ten minutes late or be skipped under load. That is fine here - the endpoint
# works from "what has not been sent today" rather than "did the last tick
# fire", so a late tick sends everything that came due in the meantime.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets you fire a tick from the Actions tab to test the secrets.
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  tick:
    name: Call the reminder tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      # A fork or a fresh clone has no secrets. Exiting 0 keeps the schedule
      # from painting the Actions tab red on every fifth minute for nothing;
      # the notice says what to configure.
      - name: Tick
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SERVER_URL and CRON_SECRET repository secrets are not set; skipping the tick."
            exit 0
          fi
          curl -fsS -H "X-Cron-Secret: $CRON_SECRET" "${SERVER_URL%/}/api/v1/cron/tick"
