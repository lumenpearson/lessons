# The same 34 `:core:designsystem` pins, and for a sharper reason than when that
# one was written. Robolectric 4.17 does now ship a jar for this project's
# compileSdk, but its shadows have not caught up with it: emulating Android 17
# dies in `setUpApplicationState` on `ApplicationSharedMemory` reaching into a
# raw FileDescriptor, and then on `InputManager.getInstance()`, which that
# release removed. Neither is anything these tests are about.
#
# 34 is a real level this app supports (minSdk is 26) and is well past every API
# the screens here touch. If a screen ever needs newer platform behaviour, raise
# this deliberately rather than reaching for JVM `--add-exports` flags: those
# got past the first failure and straight into the second.
sdk=34

# A plain Application, not this project's own. `LessonsApp.onCreate` schedules
# the sync worker, and WorkManager's own initializer is disabled in the manifest
# because the app initializes it itself - so Robolectric building the real
# Application throws before any test body runs. Nothing here is about startup:
# these tests compose one screen and press it. A test that does want startup can
# ask for the real class with `@Config(application = LessonsApp::class)`.
application=android.app.Application
