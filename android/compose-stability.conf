// Types the Compose compiler cannot see inside, and which this project knows
// are immutable.
//
// The compiler infers stability from a class's own fields. It cannot do that
// for a type compiled elsewhere with no stability information, so it assumes
// the worst — and one such field makes the whole class that holds it unstable.
// Measured before this file existed: 36 of the 94 classes in `:app` were
// unstable, and every state class among them was unstable for exactly one
// reason, a date. `TodayUiState` has fourteen stable fields and one
// `LocalDateTime`; `DiaryRange` is two `LocalDate`s and nothing else.
//
// What that costs is not recomposition — strong skipping keeps every one of
// the 172 restartable composables skippable — but the comparison it skips on.
// An unstable parameter is compared by identity, so a state object rebuilt
// with identical contents is a different object and the subtree is drawn
// again. A stable one is compared with `equals`, which for these data classes
// is the question actually being asked.
//
// java.time is safe to promise: every type here is final or effectively final,
// documented as immutable and thread-safe, and none of them has a setter. The
// promise would be a lie for a type that can change behind the reference, and
// a lie here is invisible — the screen simply keeps the old value.
//
// The domain module is the second promise, and it is one this repository can
// check. `:core:model` is a single package of data classes, enums, sealed
// interfaces and four stateless objects — no `var`, no mutable collection, no
// reference to anything that can change underneath it. It is deliberately a
// pure-JVM module, which is why its tests run in seconds, so it is not compiled
// by the Compose plugin and carries no stability of its own; without this line
// `SchoolDay` is unstable, and it alone makes `TodayUiState` and `WeekDayUi`
// unstable after the dates are fixed. `StabilityPromiseTest`, in that module,
// reads its own source and holds every clause of that sentence: it fails on a
// `var`, on a mutable collection or an array, on a `Throwable`, on a
// function-typed property, on a delegate, and on a property of any type this
// file does not promise. It was one regex for `var` for a long time, and a
// `var` is only the most obvious of those — `val items: MutableList<X>` needs
// none. What the guard still cannot see is listed at the top of it rather than
// left to be discovered, because a promise is only as good as the edge of the
// thing checking it.
//
// `:core:data` is measured and deliberately left out. Its value types
// (`AppSettings`, `Session`, `DiarySession`, `School`) would qualify, but they
// share the `repository` package with the repositories themselves, which hold
// live state, and with `ManageFailure` and `DiaryFailure`, which are
// `Throwable`s — and a `Throwable` really is mutable, `addSuppressed` and
// `fillInStackTrace` being the whole point of it. A wildcard would promise for
// all of them. Naming the four by hand is a list that goes stale in silence,
// which is the failure this project keeps writing tests against, so the four
// stay unstable until something measures that it matters.
//
// Deliberately NOT declared stable: `kotlin.collections.List`. It is the other
// half of every report line above (`runtime val groups: List<HomeworkGroup>`),
// and declaring it would be the exact lie described: `List` is an interface a
// mutable list satisfies, and a screen handed one that is mutated in place
// would never redraw. The runtime resolves those correctly on its own once the
// element type is stable, which is what this file makes true.
java.time.*
com.lumenpearson.lessons.core.model.*
