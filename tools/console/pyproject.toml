[project]
name = "lessons-console"
version = "0.1.0"
description = "Local build and contract console for Lessons"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyPI JSON release metadata checked on 26 November 2026.
    "textual==8.2.8",
    "PyYAML==6.0.4",
]

[project.scripts]
lessons-console = "lessons_console.app:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
lessons_console = ["ci_contract.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
